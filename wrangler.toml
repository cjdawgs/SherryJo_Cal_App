name = "sherryjo-cal-app"
main = "platform/cloudflare/src/worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ORIGIN_BASE_URL = "https://sherryjo-cal-app.onrender.com"
JWT_ISSUER = "sherryjo-calendar"
JWT_AUDIENCE = "sherryjo-calendar-app"
JWT_CLOCK_SKEW_SECONDS = "30"
JWT_MAX_LIFETIME_SECONDS = "3600"
TV_APP_VERSION = "3c0f10f84c6d30cc6c16dae0313004219a4dc676"
GOOGLE_CLIENT_ID = "680630646564-pf1vacnv9f1659e1kdebcenb0pvgrhs3.apps.googleusercontent.com"
MS_CLIENT_ID = "db1b5b12-6509-4653-8d94-c7a320528c6f"
MS_TENANT_ID = "common"
JWT_ACTIVE_KID = "jwt-20260804-030b2267fd45"
GOOGLE_AUTH_MODE = "native"
MS_AUTH_MODE = "native"
CALENDAR_READ_MODE = "native"
CURRENT_USER_READ_MODE = "native"
DATE_STICKY_READ_MODE = "native"
DATE_STICKY_WRITE_MODE = "native"
EVENT_WRITE_MODE = "native"
LEGACY_EVENT_READ_MODE = "native"
NOTE_READ_MODE = "native"
NOTE_WRITE_MODE = "native"
TAG_COLOR_READ_MODE = "native"
TAG_COLOR_WRITE_MODE = "native"
TASK_READ_MODE = "native"
TASK_WRITE_MODE = "native"
TV_VERSION_READ_MODE = "native"

[secrets]
required = ["EDGE_PROXY_SECRET", "JWT_PUBLIC_KEYS_JSON", "GOOGLE_CLIENT_SECRET", "MS_CLIENT_SECRET", "TOKEN_ENCRYPTION_KEY", "JWT_PRIVATE_KEY"]

[observability]
enabled = true
head_sampling_rate = 1

[[hyperdrive]]
binding = "HYPERDRIVE_RLS_NO_CACHE"
id = "2bb6bc680a594a15aa12991869cbb590"


EVENT_WRITE_MODE = "proxy"
LEGACY_EVENT_READ_MODE = "shadow"
NOTE_READ_MODE = "shadow"
NOTE_WRITE_MODE = "proxy"
TAG_COLOR_READ_MODE = "shadow"
TAG_COLOR_WRITE_MODE = "proxy"
TASK_READ_MODE = "shadow"

name: Cloudflare Canary Monitor

on:
    schedule:
        - cron: "17 */6 * * *"
    workflow_dispatch:
        inputs:
            render_url:
                description: Direct Render origin URL
                required: true
                default: https://sherryjo-cal-app.onrender.com
                type: string
            canary_url:
                description: Isolated Cloudflare canary URL
                required: true
                default: https://sherryjo-cal-app-canary.realty-cal.workers.dev
                type: string

permissions:
    contents: read

concurrency:
    group: sherryjo-cloudflare-canary-monitor
    cancel-in-progress: false

jobs:
    parity:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            RENDER_URL: ${{ inputs.render_url || vars.SHERRYJO_RENDER_MONITOR_URL || 'https://sherryjo-cal-app.onrender.com' }}
            CANARY_URL: ${{ inputs.canary_url || vars.SHERRYJO_CLOUDFLARE_CANARY_URL || 'https://sherryjo-cal-app-canary.realty-cal.workers.dev' }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Install monitor dependency
              run: python -m pip install websockets==16.1

            - name: Run direct Render and canary parity
              run: |
                  set -euo pipefail
                  max_attempts=3
                  attempt=1
                  until [ "$attempt" -gt "$max_attempts" ]; do
                      echo "Running parity attempt ${attempt}/${max_attempts}"
                      if python deployment/shadow_parity.py \
                          --render-url "$RENDER_URL" \
                          --cloudflare-url "$CANARY_URL" \
                          --json-output canary-monitor-report.json; then
                          echo "Parity check passed on attempt ${attempt}"
                          break
                      fi

                      if [ "$attempt" -eq "$max_attempts" ]; then
                          echo "Parity check failed after ${max_attempts} attempts"
                          exit 1
                      fi

                      attempt=$((attempt + 1))
                      echo "Parity check failed; retrying in 30 seconds"
                      sleep 30
                  done

            - name: Upload monitor report
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: canary-monitor-${{ github.run_id }}-${{ github.run_attempt }}
                  path: canary-monitor-report.json
                  if-no-files-found: error
                  retention-days: 14

name: Cloudflare Canary Monitor

on:
    schedule:
        - cron: "17 * * * *"
    workflow_dispatch:
        inputs:
            render_url:
                description: Direct Render origin URL
                required: true
                default: https://sherryjo-cal-app.onrender.com
                type: string
            canary_url:
                description: Isolated Cloudflare canary URL
                required: true
                default: https://sherryjo-calendar-edge-canary.realty-cal.workers.dev
                type: string

permissions:
    contents: read

concurrency:
    group: sherryjo-cloudflare-canary-monitor
    cancel-in-progress: false

jobs:
    parity:
        if: ${{ github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_CANARY_MONITOR_ENABLED == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            RENDER_URL: ${{ inputs.render_url || vars.SHERRYJO_RENDER_MONITOR_URL || 'https://sherryjo-cal-app.onrender.com' }}
            CANARY_URL: ${{ inputs.canary_url || vars.SHERRYJO_CLOUDFLARE_CANARY_URL || 'https://sherryjo-calendar-edge-canary.realty-cal.workers.dev' }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install monitor dependency
              run: python -m pip install websockets==16.1

            - name: Run direct Render and canary parity
              run: >-
                  python deployment/shadow_parity.py
                  --render-url "$RENDER_URL"
                  --cloudflare-url "$CANARY_URL"
                  --json-output canary-monitor-report.json

            - name: Upload monitor report
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                  name: canary-monitor-${{ github.run_id }}-${{ github.run_attempt }}
                  path: canary-monitor-report.json
                  if-no-files-found: error
                  retention-days: 14

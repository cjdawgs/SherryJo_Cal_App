name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_hosted_smoke:
        description: Run the read-only Render/Cloudflare hosted smoke checks
        required: true
        default: false
        type: boolean
      run_authenticated_smoke:
        description: Run reversible authenticated smoke checks using the designated test account
        required: true
        default: false
        type: boolean
      render_url:
        description: Direct Render origin URL
        required: true
        default: https://sherryjo-cal-app.onrender.com
        type: string
      cloudflare_url:
        description: Cloudflare Worker URL
        required: true
        default: https://sherryjo-cal-app.realty-cal.workers.dev
        type: string

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-contract:
    runs-on: ubuntu-latest
    env:
      ADMIN_SETUP_CODE: test-admin-code
      BASE_URL: https://calendar.example.com
      DATABASE_URL: postgresql+psycopg2://user:pass@db.example.com/app
      DB_TYPE: postgres
      DISABLE_SQLITE_FALLBACK: "1"
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_REDIRECT_URI: https://calendar.example.com/auth/google/callback
      JWT_ALGORITHM: HS256
      JWT_SECRET_KEY: test-jwt-secret
      MS_CLIENT_ID: test-client-id
      MS_CLIENT_SECRET: test-client-secret
      MS_REDIRECT_URI: https://calendar.example.com/ms/callback
      MS_TENANT_ID: test-tenant-id
      ORIGIN_BASE_URL: https://sherryjo-cal-app.onrender.com
      REQUIRE_DB_KIND: postgres
      TOKEN_ENCRYPTION_KEY: test-token-encryption-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate both deployment contracts
        run: python deployment/platform_contract.py --target all

      - name: Validate Render Python build
        run: python -m compileall -q app deployment

      - name: Install Cloudflare edge dependencies
        run: npm ci --prefix platform/cloudflare

      - name: Test Cloudflare edge contract
        run: node --test platform/cloudflare/test/*.test.js

      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Validate Cloudflare canary bundle
        run: npx --yes wrangler@4 deploy --dry-run --env canary

      - name: Validate Alembic migration graph
        run: |
          pip install -r requirements.txt
          alembic heads

  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Row Level Security cannot be exercised on SQLite, so the security
        # tests need a real PostgreSQL server.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sherryjo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DISABLE_DOTENV: "true"
      # Dummy values: the suite never contacts a provider.
      MS_CLIENT_ID: test-client-id
      MS_CLIENT_SECRET: test-client-secret
      MS_TENANT_ID: test-tenant-id
      MS_REDIRECT_URI: http://127.0.0.1:8000/ms/callback
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_REDIRECT_URI: http://127.0.0.1:8000/auth/google/callback
      JWT_SECRET_KEY: test-jwt-secret-key-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: pytest app/tests -q

      - name: Run PostgreSQL RLS tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/sherryjo_test
        run: >-
          pytest app/tests/test_security_rls.py
          app/tests/test_worker_calendar_reader_rls.py -q

  hosted-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_hosted_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install smoke dependency
        run: python -m pip install websockets==16.1

      - name: Run read-only hosted smoke checks
        run: >-
          python deployment/shadow_parity.py
          --render-url "${{ inputs.render_url }}"
          --cloudflare-url "${{ inputs.cloudflare_url }}"
          --json-output hosted-smoke-report.json

      - name: Upload hosted smoke report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hosted-smoke-report-${{ github.run_attempt }}
          path: hosted-smoke-report.json
          if-no-files-found: error
          retention-days: 14

  authenticated-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_authenticated_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SMOKE_EMAIL_SECRET_NAME: SHERRYJO_SMOKE_EMAIL
      SMOKE_PASSWORD_SECRET_NAME: SHERRYJO_SMOKE_PASSWORD
    permissions:
      contents: read
    concurrency:
      group: sherryjo-authenticated-smoke
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install smoke dependency
        run: python -m pip install websockets==16.1

      - name: Run reversible authenticated smoke checks
        env:
          SHERRYJO_SMOKE_EMAIL: ${{ secrets[env.SMOKE_EMAIL_SECRET_NAME] }}
          SHERRYJO_SMOKE_PASSWORD: ${{ secrets[env.SMOKE_PASSWORD_SECRET_NAME] }}
        run: >-
          python deployment/authenticated_smoke.py
          --allow-remote
          --render-url "${{ inputs.render_url }}"
          --cloudflare-url "${{ inputs.cloudflare_url }}"
          --json-output authenticated-smoke-report.json

      - name: Upload authenticated smoke report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-smoke-report-${{ github.run_attempt }}
          path: authenticated-smoke-report.json
          if-no-files-found: error
          retention-days: 14

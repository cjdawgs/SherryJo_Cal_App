name: Cloudflare Canary Monitor Auto Rerun

on:
    workflow_run:
        workflows:
            - Cloudflare Canary Monitor
        types:
            - completed

permissions:
    contents: read
    actions: write

jobs:
    rerun-on-runner-acquisition-failure:
        if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.run_attempt < 3 && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') }}
        runs-on: ubuntu-24.04
        steps:
            - name: Decide whether to auto-rerun
              id: inspect
              uses: actions/github-script@v7
              with:
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const runId = context.payload.workflow_run.id;
                      const attempt = context.payload.workflow_run.run_attempt;

                      const jobsResp = await github.rest.actions.listJobsForWorkflowRunAttempt({
                        owner,
                        repo,
                        run_id: runId,
                        attempt_number: attempt,
                        per_page: 100,
                      });

                      const jobs = jobsResp.data.jobs || [];
                      const hasJobs = jobs.length > 0;
                      const noStepsExecuted = hasJobs && jobs.every((job) => !job.steps || job.steps.length === 0);

                      core.info(`Run ${runId} attempt ${attempt} has ${jobs.length} job(s)`);
                      core.info(`No steps executed across all jobs: ${noStepsExecuted}`);

                      if (!noStepsExecuted) {
                        core.info('Not auto-rerunning because this is not a runner-acquisition failure.');
                        core.setOutput('should_rerun', 'false');
                        return;
                      }

                      core.setOutput('should_rerun', 'true');

            - name: Auto-rerun canary workflow
              if: steps.inspect.outputs.should_rerun == 'true'
              uses: actions/github-script@v7
              with:
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const runId = context.payload.workflow_run.id;
                      await github.rest.actions.reRunWorkflow({ owner, repo, run_id: runId });
                      core.info(`Triggered rerun for run ${runId}`);

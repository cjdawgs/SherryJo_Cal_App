name: Render Hot-Spare Monitor

on:
    schedule:
        - cron: "37 5 * * *"
    workflow_dispatch:
        inputs:
            render_url:
                description: Direct Render origin URL
                required: true
                default: https://sherryjo-cal-app.onrender.com
                type: string

permissions:
    contents: read

concurrency:
    group: sherryjo-render-hot-spare-monitor
    cancel-in-progress: false

jobs:
    direct-render-synthetic:
        if: ${{ github.event_name == 'workflow_dispatch' || vars.RENDER_HOT_SPARE_MONITOR_ENABLED == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: render-monitor
        env:
            RENDER_URL: ${{ inputs.render_url || vars.SHERRYJO_RENDER_MONITOR_URL || 'https://sherryjo-cal-app.onrender.com' }}
            SHERRYJO_SMOKE_TOKEN: ${{ secrets.SHERRYJO_SMOKE_TOKEN }}
            SHERRYJO_SMOKE_EMAIL: ${{ secrets.SHERRYJO_SMOKE_EMAIL }}
            SHERRYJO_SMOKE_PASSWORD: ${{ secrets.SHERRYJO_SMOKE_PASSWORD }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: Install monitor dependency
              run: python -m pip install websockets==16.1

            - name: Run direct Render synthetic
              run: |
                  if [ -n "$SHERRYJO_SMOKE_TOKEN" ] || { [ -n "$SHERRYJO_SMOKE_EMAIL" ] && [ -n "$SHERRYJO_SMOKE_PASSWORD" ]; }; then
                      python deployment/render_synthetic.py \
                        --allow-remote \
                        --render-url "$RENDER_URL" \
                        --json-output render-synthetic-report.json
                  else
                      python - <<'PY'
                      import json
                      import os

                      report = {
                          "mode": "direct-render",
                          "target_url": os.environ["RENDER_URL"],
                          "passed": False,
                          "checks": [],
                          "cleanup": {"attempted": False, "passed": False},
                          "failures": [],
                          "skipped": True,
                          "skip_reason": "missing_smoke_credentials",
                      }
                      print(json.dumps(report, indent=2))
                      with open("render-synthetic-report.json", "w", encoding="utf-8") as handle:
                          json.dump(report, handle, indent=2)
                          handle.write("\n")
                      PY
                  fi

            - name: Upload direct Render report
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: render-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
                  path: render-synthetic-report.json
                  if-no-files-found: error
                  retention-days: 30

name: Cloudflare Release

# Fully automated release pipeline: every push to main runs verify -> deploy
# canary -> canary smoke tests -> auto-promote to the production root Worker
# -> production smoke tests. There is no manual approval step; a failing
# job at any stage blocks everything after it (automated tests are the gate).
# workflow_dispatch remains available for an on-demand re-run against a
# specific set of URLs (for example, re-checking after a monitor alert).
on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            render_url:
                description: Direct Render origin URL
                required: true
                default: https://sherryjo-cal-app.onrender.com
                type: string
            canary_url:
                description: Isolated Cloudflare canary URL
                required: true
                default: https://sherryjo-cal-app-canary.realty-cal.workers.dev
                type: string
            production_url:
                description: Root Cloudflare Worker URL
                required: true
                default: https://sherryjo-cal-app.realty-cal.workers.dev
                type: string

permissions:
    contents: read

concurrency:
    group: sherryjo-cloudflare-release
    cancel-in-progress: false

jobs:
    verify:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: sherryjo_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DISABLE_DOTENV: "true"
            MS_CLIENT_ID: test-client-id
            MS_CLIENT_SECRET: test-client-secret
            MS_TENANT_ID: test-tenant-id
            MS_REDIRECT_URI: http://127.0.0.1:8000/ms/callback
            GOOGLE_CLIENT_ID: test-client-id
            GOOGLE_CLIENT_SECRET: test-client-secret
            GOOGLE_REDIRECT_URI: http://127.0.0.1:8000/auth/google/callback
            JWT_SECRET_KEY: test-jwt-secret-key-not-used-in-production
            TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/sherryjo_test

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: Install Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install pytest

            - name: Create isolated migration validation database
              run: |
                  python -c 'import psycopg2; connection = psycopg2.connect("dbname=postgres user=postgres password=postgres host=127.0.0.1 port=5432"); connection.autocommit = True; cursor = connection.cursor(); cursor.execute("CREATE DATABASE sherryjo_migration_test"); cursor.execute("CREATE DATABASE sherryjo_migration_drift_test"); connection.close()'

            - name: Apply Alembic migrations to PostgreSQL test database
              env:
                  DATABASE_URL: sqlite://
                  ALEMBIC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/sherryjo_migration_test
              run: alembic upgrade head

            - name: Validate migrations with pre-existing TV refresh schema
              env:
                  DATABASE_URL: sqlite://
                  ALEMBIC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/sherryjo_migration_drift_test
                  PGPASSWORD: postgres
              run: |
                  alembic upgrade aq997l22ddd11
                  psql -h 127.0.0.1 -U postgres -d sherryjo_migration_drift_test -v ON_ERROR_STOP=1 -c "ALTER TABLE public.tv_user_state ADD COLUMN remote_refresh_requested_at timestamptz, ADD COLUMN remote_refresh_device_id varchar(64); CREATE POLICY worker_tv_state_admin ON public.tv_user_state FOR ALL TO worker_calendar_reader USING (public.worker_app_is_admin()) WITH CHECK (public.worker_app_is_admin());"
                  alembic upgrade head

            - name: Run Python suite
              env:
                  TEST_MIGRATION_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/sherryjo_migration_test
              run: pytest app/tests -q

            - name: Test Cloudflare edge
              run: npm ci --prefix platform/cloudflare && npm --prefix platform/cloudflare test

            - name: Validate root and canary bundles
              run: |
                  npm --prefix platform/cloudflare run deploy:dry-run
                  npm --prefix platform/cloudflare run deploy:dry-run:canary

    migrate-supabase:
        needs: verify
        runs-on: ubuntu-latest
        env:
            ALEMBIC_DATABASE_URL: ${{ secrets.ALEMBIC_DATABASE_URL }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v6
              if: ${{ env.ALEMBIC_DATABASE_URL != '' }}
              with:
                  python-version: "3.14"

            - name: Apply Supabase migrations
              if: ${{ env.ALEMBIC_DATABASE_URL != '' }}
              env:
                  DATABASE_URL: ${{ secrets.ALEMBIC_DATABASE_URL }}
                  ALEMBIC_DATABASE_URL: ${{ secrets.ALEMBIC_DATABASE_URL }}
                  DISABLE_DOTENV: "true"
                  MS_CLIENT_ID: migration-placeholder
                  MS_CLIENT_SECRET: migration-placeholder
                  MS_TENANT_ID: migration-placeholder
                  MS_REDIRECT_URI: http://127.0.0.1:8000/ms/callback
                  GOOGLE_CLIENT_ID: migration-placeholder
                  GOOGLE_CLIENT_SECRET: migration-placeholder
                  GOOGLE_REDIRECT_URI: http://127.0.0.1:8000/auth/google/callback
                  JWT_SECRET_KEY: migration-placeholder-not-used-for-authentication
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  alembic upgrade head

            - name: Fail when migration secret is absent
              if: ${{ env.ALEMBIC_DATABASE_URL == '' }}
              run: |
                  echo "::error::ALEMBIC_DATABASE_URL is required to apply database migrations before deployment."
                  exit 1

    deploy-canary:
        needs:
            - verify
            - migrate-supabase
        runs-on: ubuntu-latest
        environment: cloudflare-canary
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: Deploy isolated canary Worker
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npm ci --prefix platform/cloudflare && npm --prefix platform/cloudflare run deploy:canary

    smoke-unauthenticated-canary:
        needs: deploy-canary
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Install smoke dependency
              run: python -m pip install websockets==16.1

            - name: Wait for canary static assets and Render schema readiness
              env:
                  RENDER_URL: ${{ inputs.render_url || vars.SHERRYJO_RENDER_MONITOR_URL || 'https://sherryjo-cal-app.onrender.com' }}
                  CANARY_URL: ${{ inputs.canary_url || vars.SHERRYJO_CLOUDFLARE_CANARY_URL || 'https://sherryjo-cal-app-canary.realty-cal.workers.dev' }}
              # 12 attempts * 15s = 3 minutes. This is the automated stand-in for the
              # human "render_deployment_ready" checkbox this pipeline used to require:
              # since nobody retries it by hand anymore, give Render's free-tier build
              # and deploy real headroom before declaring propagation failed.
              run: |
                  set -euo pipefail
                  for attempt in {1..12}; do
                      if render_bytes="$(curl --fail --silent --show-error "${RENDER_URL%/}/static/admin.js" | wc -c | tr -d '[:space:]')" \
                          && canary_bytes="$(curl --fail --silent --show-error "${CANARY_URL%/}/static/admin.js" | wc -c | tr -d '[:space:]')" \
                          && python -c 'import json,sys,urllib.request; schema=json.load(urllib.request.urlopen(sys.argv[1],timeout=10)); assert schema.get("status")=="ok", schema; assert "tv_user_state" in schema.get("required_tables",[]), schema; assert not schema.get("missing_columns"), schema' "${RENDER_URL%/}/health/schema?refresh=true" \
                          && [[ "$render_bytes" -gt 0 && "$canary_bytes" -gt 0 ]]; then
                          echo "Render and canary JavaScript assets are available; TV state schema is ready."
                          exit 0
                      fi
                      echo "Waiting for Render/canary assets and Render schema readiness (attempt $attempt/12)."
                      if [[ "$attempt" -lt 12 ]]; then
                          sleep 15
                      fi
                  done
                  echo "::error::Render/canary assets or Render TV state schema were not ready after 3 minutes."
                  exit 1

            - name: Run canary parity smoke
              env:
                  RENDER_URL: ${{ inputs.render_url || vars.SHERRYJO_RENDER_MONITOR_URL || 'https://sherryjo-cal-app.onrender.com' }}
                  CANARY_URL: ${{ inputs.canary_url || vars.SHERRYJO_CLOUDFLARE_CANARY_URL || 'https://sherryjo-cal-app-canary.realty-cal.workers.dev' }}
              run: >-
                  python deployment/shadow_parity.py
                  --render-url "$RENDER_URL"
                  --cloudflare-url "$CANARY_URL"
                  --json-output canary-parity-report.json

            - name: Upload canary parity report
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: canary-parity-${{ github.run_attempt }}
                  path: canary-parity-report.json
                  if-no-files-found: error
                  retention-days: 14

    smoke-authenticated-canary:
        needs: deploy-canary
        runs-on: ubuntu-latest
        environment: cloudflare-smoke
        concurrency:
            group: sherryjo-authenticated-smoke
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Install smoke dependency
              run: python -m pip install websockets==16.1

            - name: Run reversible canary smoke
              env:
                  SHERRYJO_SMOKE_EMAIL: ${{ secrets.SHERRYJO_SMOKE_EMAIL }}
                  SHERRYJO_SMOKE_PASSWORD: ${{ secrets.SHERRYJO_SMOKE_PASSWORD }}
                  RENDER_URL: ${{ inputs.render_url || vars.SHERRYJO_RENDER_MONITOR_URL || 'https://sherryjo-cal-app.onrender.com' }}
                  CANARY_URL: ${{ inputs.canary_url || vars.SHERRYJO_CLOUDFLARE_CANARY_URL || 'https://sherryjo-cal-app-canary.realty-cal.workers.dev' }}
              run: >-
                  python deployment/authenticated_smoke.py
                  --allow-remote
                  --cloudflare-scheduler-stopped
                  --render-url "$RENDER_URL"
                  --cloudflare-url "$CANARY_URL"
                  --json-output canary-authenticated-report.json

            - name: Upload canary authenticated report
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: canary-authenticated-${{ github.run_attempt }}
                  path: canary-authenticated-report.json
                  if-no-files-found: error
                  retention-days: 14

    promote-root-worker:
        needs:
            - smoke-unauthenticated-canary
            - smoke-authenticated-canary
        runs-on: ubuntu-latest
        environment: cloudflare-production
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "22"

            - name: Promote verified build to root Worker
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: npm ci --prefix platform/cloudflare && npm --prefix platform/cloudflare run deploy

    smoke-unauthenticated-production:
        needs: promote-root-worker
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Install smoke dependency
              run: python -m pip install websockets==16.1

            - name: Run production parity smoke
              env:
                  RENDER_URL: ${{ inputs.render_url || vars.SHERRYJO_RENDER_MONITOR_URL || 'https://sherryjo-cal-app.onrender.com' }}
                  PRODUCTION_URL: ${{ inputs.production_url || vars.SHERRYJO_CLOUDFLARE_PRODUCTION_URL || 'https://sherryjo-cal-app.realty-cal.workers.dev' }}
              run: >-
                  python deployment/shadow_parity.py
                  --render-url "$RENDER_URL"
                  --cloudflare-url "$PRODUCTION_URL"
                  --native-worker
                  --json-output production-parity-report.json

            - name: Upload production parity report
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: production-parity-${{ github.run_attempt }}
                  path: production-parity-report.json
                  if-no-files-found: error
                  retention-days: 14

    smoke-authenticated-production:
        needs: promote-root-worker
        runs-on: ubuntu-latest
        environment: cloudflare-smoke
        concurrency:
            group: sherryjo-authenticated-smoke
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Install smoke dependency
              run: python -m pip install websockets==16.1

            - name: Run reversible production smoke
              env:
                  SHERRYJO_SMOKE_EMAIL: ${{ secrets.SHERRYJO_SMOKE_EMAIL }}
                  SHERRYJO_SMOKE_PASSWORD: ${{ secrets.SHERRYJO_SMOKE_PASSWORD }}
                  RENDER_URL: ${{ inputs.render_url || vars.SHERRYJO_RENDER_MONITOR_URL || 'https://sherryjo-cal-app.onrender.com' }}
                  PRODUCTION_URL: ${{ inputs.production_url || vars.SHERRYJO_CLOUDFLARE_PRODUCTION_URL || 'https://sherryjo-cal-app.realty-cal.workers.dev' }}
              run: >-
                  python deployment/authenticated_smoke.py
                  --allow-remote
                  --render-url "$RENDER_URL"
                  --cloudflare-url "$PRODUCTION_URL"
                  --json-output production-authenticated-report.json

            - name: Upload production authenticated report
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: production-authenticated-${{ github.run_attempt }}
                  path: production-authenticated-report.json
                  if-no-files-found: error
                  retention-days: 14

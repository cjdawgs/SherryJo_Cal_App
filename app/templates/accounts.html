
<!DOCTYPE html>
<html>
<head>
    <title>Account Manager</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background: #f5f6fa;
        }
        
        img {
            max-width: 100%;
            height: auto;
            display: inline-block;
        }

        /* ✅ FIX PROVIDER BUTTON SIZE (CRITICAL) */
        .providerBtn {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            width: auto;
            height: auto;

            padding: 6px 10px;
        }

        /* ✅ FORCE ICON SIZE (CRITICAL) */
        .providerBtn img {
            width: 20px !important;
            height: 20px !important;
            max-width: 20px !important;
            max-height: 20px !important;
            object-fit: contain;
        }

        /* ✅ PROVIDER BUTTON STYLING */
        .providerBtn {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        .providerBtn:hover {
            background: #f5f5f5;
        }

        /* ✅ HELPER TEXT UNDER BUTTONS */
        .provider-helpers {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #666;
        }

        .helper-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .helper-text a {
            color: #2563eb;
            text-decoration: none;
        }

        .helper-text a:hover {
            text-decoration: underline;
        }

        .account {
        max-width: 700px;
        overflow: hidden;
        }

        h2 {
            margin-bottom: 20px;
        }

        .account {
            padding: 12px;
            margin-bottom: 8px;
            background: white;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .account:hover {
        background: #f9fafb;
        }

        .left {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .provider {
            font-weight: bold;
        }

        .google { color: #d93025; }
        .microsoft { color: #0078d4; }

        button {
            margin-left: 5px;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }

        button:hover {
            background: #f0f0f0;
        }

        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div style="
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
">

  <h2 style="margin:0;">Accounts</h2>

  <div style="display:flex; gap:6px;">
    <button onclick="goToCalendar()" title="Back to calendar">
      ⇦
    </button>
  </div>
</div>

<!-- =====================================================
✅ PROVIDER CONNECT BUTTONS (MOVED FROM CALENDAR UI)
✅ SAME IDs → JS CONTINUES TO WORK
===================================================== -->
<!-- =======================================================
✅ TRUE 3-COLUMN PROVIDER SYSTEM (FINAL ARCHITECTURE)
======================================================= -->
<div class="provider-grid"
     style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px;">


  <!-- ✅ GOOGLE -->
  <div class="provider-col">

    <button class="providerBtn google" onclick="addGoogle()">
      <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png">
      Google
    </button>

    <div class="provider-desc">
      Connect your Google Calendar instantly
    </div>

    <div class="provider-spacer"></div>

    <div id="googleAccounts"></div>

  </div>

  <!-- ✅ MICROSOFT -->
  <div class="provider-col">

    <button class="providerBtn microsoft" onclick="addMicrosoft()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg">
      Microsoft
    </button>

    <div class="provider-desc">
      Connect Outlook / Office 365 calendars
    </div>

    <div class="provider-spacer"></div>

    <div id="microsoftAccounts"></div>

  </div>

  <!-- ✅ APPLE -->
  <div class="provider-col">

    <button class="providerBtn apple" onclick="openAppleID()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg">
      Apple
    </button>

    <div class="provider-desc">
      Requires an App Password —
      <a href="https://support.apple.com/en-us/HT204397" target="_blank">learn more</a>
    </div>

    <!-- ✅ MOVE APPLE CONNECT HERE -->
    <details style="margin-top:8px;">
        <summary style="cursor:pointer; font-weight:600; font-size:13px;">
            + Connect Apple (Manual)
        </summary>

        <div style="
            background:white;
            padding:12px;
            border-radius:6px;
            margin-top:8px;
            max-width:100%;
        ">
            
            <p style="
            background:#fffbeb;
            border-left:4px solid #f59e0b;
            padding:10px;
            margin:0 0 10px 0;
            border-radius:4px;
            font-size:12px;
            color:#78350f;
            ">
            <strong>Apple requires an App Password</strong> from your Apple ID settings.
            </p>

            <input id="apple-email" placeholder="Apple ID Email" style="
            display:block;
            width:100%;
            margin-bottom:6px;
            padding:6px;
            " />

            <input id="apple-password" placeholder="App Password" style="
            display:block;
            width:100%;
            margin-bottom:6px;
            padding:6px;
            " />

            <button onclick="testApple()">Test</button>
            <button onclick="connectApple()">Connect</button>

            <div id="apple-status" style="margin-top:8px;"></div>

        </div>
    </details>

    <div id="appleAccounts"></div>

  </div>

</div>




<br>

<!-- ERRORS -->
<div id="error" class="error"></div>

<script>

// ============================
// HEALTH STATUS
// ============================
/**************************************************************
 * ✅ ENHANCED SYNC STATUS (VISUAL + ACTIONABLE)
 **************************************************************/
function getHealthStatus(acc) {

    // ✅ NEVER TRIED
    if (!acc.last_sync_success && !acc.last_sync_failure) {
        return `<span style="color:#999;">⚪ Never Synced</span>`;
    }

    // ✅ SUCCESS
    if (acc.last_sync_success && !acc.last_sync_failure) {
        return `<span style="color:#16a34a; font-weight:500;">✅ Synced</span>`;
    }

    // ✅ ERROR (failure AFTER success or alone)
    if (acc.last_sync_failure) {
        return `<span style="color:#dc2626; font-weight:500;">❌ Error</span>`;
    }

    return `<span style="color:#999;">Unknown</span>`;
}


// ============================
// ERROR DISPLAY
// ============================
function getErrorMessage(acc) {
    if (!acc.last_error || !acc.last_sync_failure) return "";

    let msg = acc.last_error;

    if (msg.length > 120) {
        msg = msg.substring(0, 120) + "...";
    }

    return `
        <div style="color:red; font-size:12px;">
            ⚠ ${msg}
        </div>
    `;
}

// ============================
// NAVIGATION
// ============================
function goToCalendar() {
    window.location.href = "/calendar-ui";
}

function goBack() {
    window.history.back();
}

// hide back button if no history
window.addEventListener("load", () => {
    if (window.history.length <= 1) {
        const btn = document.getElementById("back-btn");
        if (btn) btn.style.display = "none";
    }
});

// ============================
// RETRY ACCOUNT SYNC
// ============================
async function retryAccount(id) {

    const token = localStorage.getItem("token");

    try {
        const res = await fetch(`/accounts/${id}/retry`, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        let data;
        try {
            data = await res.json();
        } catch {
            data = { message: "Server error" };
        }

        alert(data.message || "Retry complete");

        // ✅ refresh UI after retry
        loadAccounts();

    } catch (err) {
        console.error(err);
        alert("Retry failed");
    }
}

// ============================
// LOAD ACCOUNTS
// ============================
async function loadAccounts() {
    const errorBox = document.getElementById("error");
    errorBox.innerText = "";

    const token = localStorage.getItem("token");
    if (!token) {
        errorBox.innerText = "Missing login token.";
        return;
    }

    try {
        const res = await fetch("/accounts", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        if (!res.ok) {
            errorBox.innerText = "Failed to load accounts";
            return;
        }

        const data = await res.json();
        const accounts = Array.isArray(data) ? data : (data.accounts || []);

        /**************************************************************
        ✅ SINGLE SOURCE — GROUP BY PROVIDER
        **************************************************************/
        const groups = {
        google: [],
        microsoft: [],
        apple: []
        };

        accounts.forEach(acc => {
        console.log("ACCOUNT DATA:", acc);

        const key = (acc.provider || "").toLowerCase();
        if (groups[key]) {
            groups[key].push(acc);
        }
        });

        /**************************************************************
        ✅ RENDER INTO 3 COLUMNS (SOURCE OF TRUTH)
        **************************************************************/
        Object.entries(groups).forEach(([provider, list]) => {

        const container = document.getElementById(provider + "Accounts");
        if (!container) {
            console.warn("Missing container:", provider);
            return;
        }

        container.innerHTML = "";

        if (!list.length) {
            container.innerHTML = "<i>No accounts</i>";
            return;
        }

        list.forEach(acc => {

            const div = document.createElement("div");
            div.className = "account";

            div.innerHTML = `
            <div class="left">
                <span class="provider ${provider}">
                ${provider.toUpperCase()}
                </span>

                <span>
                ${acc.account_email || "UNKNOWN"}
                </span>

                ${acc.is_primary ? "⭐" : ""}
            </div>

            <div>
                <button onclick="setPrimary(${acc.id})">Primary</button>
                <button onclick="toggleSync(${acc.id}, ${!acc.sync_enabled})">
                ${acc.sync_enabled ? "Disable" : "Enable"}
                </button>
                <button onclick="removeAccount(${acc.id})">Remove</button>
                <button onclick="retryAccount(${acc.id})">Retry</button>
            </div>
            `;

            container.appendChild(div);
        });

        });


    } catch (err) {
        console.error(err);
        errorBox.innerText = "Error loading accounts";
    }
}

// ============================
// ADD ACCOUNT
// ============================
function addGoogle() {
    const token = localStorage.getItem("token");
    window.location.href = "/auth/google/login?token=" + token;
}

function addMicrosoft() {
    const token = localStorage.getItem("token");
    window.location.href = "/ms/login?token=" + token;
}

// ============================
// APPLE ID MANAGEMENT
// ============================
function openAppleID() {
    window.open("https://appleid.apple.com/account/manage", "_blank");
}

// ============================
// ACTIONS
// ============================
async function setPrimary(id) {
    await fetch(`/accounts/${id}/set-primary`, {
        method: "PUT",
        headers: {
            "Authorization": "Bearer " + localStorage.getItem("token")
        }
    });
    loadAccounts();
}

async function toggleSync(id, enabled) {
    await fetch(`/accounts/${id}/sync/${enabled}`, {
        method: "PUT",
        headers: {
            "Authorization": "Bearer " + localStorage.getItem("token")
        }
    });
    loadAccounts();
}

async function removeAccount(id) {
    await fetch(`/accounts/${id}`, {
        method: "DELETE",
        headers: {
            "Authorization": "Bearer " + localStorage.getItem("token")
        }
    });
    loadAccounts();
}

// ============================
// APPLE TEST (SAFE)
// ============================
async function testApple() {
    const email = document.getElementById("apple-email").value;
    const password = document.getElementById("apple-password").value;

    const statusDiv = document.getElementById("apple-status");
    statusDiv.innerText = "Testing...";

    try {
        const res = await fetch("/accounts/apple/test", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + localStorage.getItem("token")
            },
            body: JSON.stringify({
                email: email,
                app_password: password,
                caldav_url: "https://caldav.icloud.com"
            })
        });

        let data;
        try {
            data = await res.json();
        } catch {
            data = { message: "Server error" };
        }

        if (!res.ok || data.success === false) {
            statusDiv.innerText = "❌ " + (data.message || "Connection failed");
        } else {
            statusDiv.innerText = "✅ Connection successful";
        }

    } catch (err) {
        console.error(err);
        statusDiv.innerText = "❌ Request failed";
    }
}

// ============================
// APPLE CONNECT (SAFE)
// ============================
async function connectApple() {
    const email = document.getElementById("apple-email").value;
    const password = document.getElementById("apple-password").value;

    const statusDiv = document.getElementById("apple-status");
    statusDiv.innerText = "Connecting...";

    try {
        const res = await fetch("/accounts/apple/connect", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + localStorage.getItem("token")
            },
            body: JSON.stringify({
                email: email,
                app_password: password,
                caldav_url: "https://caldav.icloud.com"
            })
        });

        let data;
        try {
            data = await res.json();
        } catch {
            data = { message: "Server error" };
        }

        if (!res.ok || data.success === false) {
            statusDiv.innerText = "❌ " + (data.message || "Failed");
        } else {
            statusDiv.innerText = "✅ Apple connected!";
            loadAccounts();
        }

    } catch (err) {
        console.error(err);
        statusDiv.innerText = "❌ Request failed";
    }
}

// ============================
// INIT
// ============================
const params = new URLSearchParams(window.location.search);

if (params.get("token")) {
    localStorage.setItem("token", params.get("token"));
}

loadAccounts();

</script>

</body>
</html>

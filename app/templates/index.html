<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ LOAD .js now moved to BOTTOM above the   </body>
  <script src="/static/calendar.js?v=3"></script>
  --> 

  <!-- ✅ LOAD CSS FIRST -->
  <link rel="stylesheet" href="{{ asset_url('style.css') }}">

  <script type="importmap">
    {{ asset_import_map_json(asset_imports)|safe }}
  </script>

  <!-- ✅ FULLCALENDAR -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>


<body>

<!-- =====================================================
✅ HEADER
===================================================== -->
<header class="topbar">
  <div class="topbar-inner">

    <div class="appTitleRow">
      <button id="sidebarToggleBtn" class="sidebarToggleBtn" type="button" aria-controls="sidebarDrawer" aria-expanded="false" aria-label="Toggle sidebar">
        ☰
      </button>
      <div class="appTitle">SherryJo Calendar</div>
      <span id="devRoleBadge" class="devRoleBadge hidden" title="Development role badge"></span>
    </div>

      <div class="authContainer">
            <div id="syncBanner" style="
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: #f59e0b;
        color: white;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 13px;
        display: none;
        z-index: 9999;
      ">
        ⏳ Syncing calendar...
      </div>

      <section class="controlBand" aria-label="Calendar controls">
        <div class="controlBandPrimary">
          <!-- ✅ CONNECTED ACCOUNTS -->
          <div id="accounts" class="accounts hidden"></div>

          <!-- ✅ COLOR LEGEND -->
          <div id="calendarLegend" class="calendarLegend"></div>
        </div>

        <div class="controlBandActions">
          <!-- ✅ ACTION BUTTONS -->
          <div class="actionButtons">

            <!-- ✅ UPDATED BUTTON (clearer + tooltip) -->
            <button id="createBtn"
              title="Example: 'Doctor Appointment at 3pm' or 'Team Meeting 10:00–11:00'">
              ➕ Create Event
            </button>

            <!--
            <button id="addTaskBtn">Add</button>
            <button id="saveEventBtn">Save</button>
            <button id="cancelEventBtn">Cancel</button>
            -->

            <!-- ✅ ACCOUNTS / ADMIN HOVER MENU -->
            <div class="gearMenuShell" id="gearMenuShell">
              <button id="accountsBtn" title="Open account actions" aria-haspopup="menu" aria-expanded="false">
                ⚙
              </button>
              <div id="accountsHoverMenu" class="accountsHoverMenu" role="menu" aria-label="Account actions">
                <button id="manageAccountsMenuBtn" type="button" role="menuitem">Manage Accounts</button>
                <button id="adminMenuBtn" type="button" role="menuitem" class="hidden">Admin Dashboard</button>
              </div>
            </div>

            <!-- ✅ UNDO/REDO + SYNC (requested order: Undo, Redo, Sync) -->
            <button id="undoBtn" title="Undo (Ctrl+Z)" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24">
                <path fill="currentColor" d="M12.5 8H7.83l2.09-2.09L8.5 4.5 4 9l4.5 4.5 1.41-1.41L7.83 10h4.67c2.21 0 4 1.79 4 4s-1.79 4-4 4H8v2h4.5c3.31 0 6-2.69 6-6s-2.69-6-6-6z"/>
              </svg>
            </button>

            <button id="redoBtn" title="Redo (Ctrl+Y)" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24">
                <path fill="currentColor" d="M11.5 8H16.17l-2.09-2.09 1.42-1.41L20 9l-4.5 4.5-1.41-1.41L16.17 10H11.5c-2.21 0-4 1.79-4 4s1.79 4 4 4H16v2h-4.5c-3.31 0-6-2.69-6-6s2.69-6 6-6z"/>
              </svg>
            </button>

            <button id="syncBtn" title="Sync calendars">
              <svg width="14" height="14" viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M17.65 6.35A7.95 7.95 0 0012 4V1L7 6l5 5V7a5 5 0 11-5 5H5a7 7 0 107.75-6.97z"/>
              </svg>
            </button>

            <!-- ✅ PUBLISH — push local canonical events back to all provider accounts -->
            <button id="publishBtn" title="Publish local changes to all connected accounts">
              <svg width="14" height="14" viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>
              </svg>
            </button>

            <!-- ✅ DEDUP TOGGLE — merge identical cross-account events into one canonical row -->
            <button id="dedupBtn" title="Toggle cross-account deduplication">
              <svg width="14" height="14" viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M17 20.41L18.41 19 15 15.59 13.59 17 17 20.41zM7.5 8H11v5.59L5.59 19 7 20.41l6-6V8h3.5L12 3.5 7.5 8z"/>
              </svg>
            </button>

            <!-- ✅ LOGOUT (SUBTLE ICON) -->
            <button id="logoutBtn" title="Logout">
              <svg width="14" height="14" viewBox="0 0 24 24">
                <path fill="currentColor"
                  d="M16 17l5-5-5-5v3H9v4h7v3zM4 19h8v2H4a2 2 0 01-2-2V5a2 2 0 012-2h8v2H4v14z"/>
              </svg>
            </button>

          </div>
        </div>
      </section>

    </div>

  </div>
</header>

<!-- =====================================================
✅ MAIN LAYOUT
===================================================== -->
<main class="layout">

  <!-- ✅ CALENDAR -->
  <div class="calendarPanel">

    <!-- ✅ FULLCALENDAR WILL OWN HEADER NOW -->
    <div id="rangeDisplay" class="calendarRangeDisplay" aria-live="polite"></div>
    <div id="calendar"></div>

  </div>

  <!-- ✅ RIGHT SIDEBAR -->
  <aside id="sidebarDrawer" class="leftSidebar" aria-label="Calendar sidebar">

    <div class="sidebarDrawerHeader">
      <h4>Details</h4>
      <button id="sidebarCloseBtn" class="sidebarCloseBtn" type="button" aria-label="Close sidebar">Close</button>
    </div>

    <!-- ✅ DAY DETAILS -->
    <div class="card">
      <h4 id="selectedDateTitle">Select a day</h4>
      <ul id="dayEventsList"></ul>
    </div>

    <!-- ✅ WEEK VIEW -->
    <div class="card">
      <h4>This Week</h4>
      <div id="weekView"></div>
    </div>

    <!-- ✅ TASK LIST -->
    <div class="card">
      <h4>Tasks</h4>

      <div style="display:flex; gap:5px; margin-bottom:8px;">
        <input id="taskInput" placeholder="Add task..." style="flex:1;" />
        <button onclick="addTask()">Add</button>
      </div>

      <ul id="taskList"></ul>
    </div>

  </aside>

</main>

<div id="sidebarDrawerBackdrop" class="sidebarDrawerBackdrop" aria-hidden="true"></div>


<!-- =====================================================
✅ ✅ ✅ CREATE / EDIT EVENT MODAL (THIS WAS MISSING)
===================================================== -->
<div id="modalOverlay" class="modalOverlay"></div>

<div id="createEventModal" class="modal modalEngine" data-modal-type="event">
  <div class="modalHeader">
    <div>
      <h3 id="modalTitleText">Create Event</h3>
      <p id="modalSubtitleText" class="modalSubtitle">
        Structured event editor with schedule, notes, tags, and sticky metadata.
      </p>
    </div>
  </div>

  <div class="modalBody">
    <section class="modalSection eventOnly">
      <label class="fieldLabel" for="eventTitle">Title</label>
      <input id="eventTitle" placeholder="e.g. Team Meeting or Dentist Appointment" />
    </section>

    <section class="modalSection eventOnly eventGrid2">
      <div>
        <label class="fieldLabel" for="eventDate">Date</label>
        <input id="eventDate" type="date" />
      </div>
      <div class="eventGrid2Times">
        <div>
          <label class="fieldLabel" for="eventStart">Start</label>
          <input id="eventStart" type="time" title="Start time (optional)" />
        </div>
        <div>
          <label class="fieldLabel" for="eventEnd">End</label>
          <input id="eventEnd" type="time" title="End time (optional)" />
        </div>
      </div>
    </section>

    <section class="modalSection eventOnly">
      <label class="fieldLabel" for="eventDescriptionEditor">Description / Notes</label>
      <div class="richToolbar" data-editor="eventDescriptionEditor">
        <select class="rt-font" title="Font">
          <option value="Arial">Arial</option>
          <option value="Calibri">Calibri</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Georgia">Georgia</option>
        </select>
        <select class="rt-size" title="Size">
          <option value="2">10</option>
          <option value="3" selected>12</option>
          <option value="4">14</option>
          <option value="5">18</option>
        </select>
        <button type="button" class="rt-btn" data-cmd="bold" title="Bold">B</button>
        <button type="button" class="rt-btn" data-cmd="italic" title="Italic">I</button>
        <button type="button" class="rt-btn" data-cmd="underline" title="Underline">U</button>
        <input type="color" class="rt-color" title="Text Color" value="#1b2740" />
        <button type="button" class="rt-btn" data-cmd="justifyLeft" title="Align Left">L</button>
        <button type="button" class="rt-btn" data-cmd="justifyCenter" title="Align Center">C</button>
        <button type="button" class="rt-btn" data-cmd="justifyRight" title="Align Right">R</button>
        <button type="button" class="rt-btn" data-cmd="insertUnorderedList" title="Bullet List">•</button>
        <button type="button" class="rt-btn" data-cmd="insertOrderedList" title="Numbered List">1.</button>
      </div>
      <div id="eventDescriptionEditor" class="richEditor" contenteditable="true" data-placeholder="Add context, agenda, or reminders..."></div>
    </section>

    <section class="modalSection eventOnly eventGrid2">
      <div>
        <label class="fieldLabel" for="eventColor">Event Color</label>
        <input id="eventColor" type="color" value="#4F8EF7" />
      </div>
      <div>
        <label class="fieldLabel" for="eventTags">Tags</label>
        <input id="eventTags" placeholder="home, family, errands" />
      </div>
    </section>

    <section class="modalSection stickySection">
      <div class="stickyToolbar">
        <div>
          <label class="fieldLabel" for="eventStickyColor">Sticky Color</label>
          <input id="eventStickyColor" type="color" value="#F7E68A" />
        </div>
        <button id="addStickyNoteBtn" class="secondaryBtn" type="button">+ Add Sticky</button>
        <button id="stickyBackToEventBtn" class="secondaryBtn" type="button">Back To Event</button>
      </div>

      <div id="stickyNotesList" class="stickyNotesList"></div>

      <div id="stickyPaper" class="stickyPaper">
        <div class="stickyFold"></div>
        <div class="richToolbar stickyToolbarPanel" data-editor="eventStickyContentEditor">
          <select class="rt-font" title="Font">
            <option value="Arial">Arial</option>
            <option value="Calibri">Calibri</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Georgia">Georgia</option>
          </select>
          <select class="rt-size" title="Size">
            <option value="2">10</option>
            <option value="3" selected>12</option>
            <option value="4">14</option>
            <option value="5">18</option>
          </select>
          <button type="button" class="rt-btn" data-cmd="bold" title="Bold">B</button>
          <button type="button" class="rt-btn" data-cmd="italic" title="Italic">I</button>
          <button type="button" class="rt-btn" data-cmd="underline" title="Underline">U</button>
          <input type="color" class="rt-color" title="Text Color" value="#3a2f14" />
          <button type="button" class="rt-btn" data-cmd="insertUnorderedList" title="Bullet List">•</button>
          <button type="button" class="rt-btn" data-cmd="insertOrderedList" title="Numbered List">1.</button>
        </div>
        <div id="eventStickyContentEditor" class="richEditor stickyEditor" contenteditable="true" data-placeholder="Write your sticky note here..."></div>
      </div>
    </section>

    <section class="modalSection eventOnly metadataSection">
      <div class="metaRow"><span>Created:</span><strong id="eventMetaCreated">-</strong></div>
      <div class="metaRow"><span>Updated:</span><strong id="eventMetaUpdated">-</strong></div>
      <div class="metaRow"><span>Source:</span><strong id="eventMetaSource">local</strong></div>
    </section>
  </div>

  <div class="modalActions">
    <div class="modalActionLeft">
      <button id="deleteEventBtn" class="dangerBtn" style="display:none;">Delete</button>
      <button id="deleteStickyBtn" class="dangerBtn" style="display:none;" type="button">Delete Selected Sticky</button>
      <button id="openStickyFromEventBtn" class="secondaryBtn" style="display:none;" type="button">Open Sticky</button>
    </div>
    <div class="modalActionRight">
      <button id="cancelEventBtn" class="secondaryBtn" type="button">Cancel</button>
      <button id="saveEventBtn" class="primaryBtn" type="button">Save Event</button>
    </div>
  </div>
</div>

<!-- ✅ Deprecating with new structure for .js handling 
    <script src="/static/calendar.js?v=999"></script> 
    <script src="/static/calendar.ui.js"></script>

<script type="module" src="{{ asset_url('calendar.js') }}"></script>
<script type="module" src="{{ asset_url('dev_role_badge.js') }}"></script>
<script src="{{ asset_url('button_hints.js') }}"></script>

<div id="editorContextMenu" class="editorContextMenu" aria-hidden="true">
  <button type="button" data-ctx-cmd="bold">Bold</button>
  <button type="button" data-ctx-cmd="italic">Italic</button>
  <button type="button" data-ctx-cmd="underline">Underline</button>
  <button type="button" data-ctx-cmd="insertUnorderedList">Bulleted List</button>
  <button type="button" data-ctx-cmd="insertOrderedList">Numbered List</button>
  <button type="button" data-ctx-cmd="removeFormat">Clear Format</button>
</div>




</body>
</html>

<!doctype html>
<script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ✅ LOAD .js now moved to BOTTOM above the   </body>
  <script src="/static/calendar.js?v=3"></script>
  --> 

  <!-- ✅ LOAD CSS FIRST -->
  <link rel="stylesheet" href="/static/style.css?v=4">

  <!-- ✅ FULLCALENDAR -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>


<body>

<!-- =====================================================
✅ HEADER
===================================================== -->
<header class="topbar">
  <div class="topbar-inner">

    <div class="appTitle">SherryJo Calendar</div>

      <div class="authContainer">
            <div id="syncBanner" style="
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: #f59e0b;
        color: white;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 13px;
        display: none;
        z-index: 9999;
      ">
        ⏳ Syncing calendar...
      </div>

      <!-- ✅ CONNECT BUTTONS -->
      <div class="authButtons">
        
        <button id="googleBtn" class="providerBtn google">
          <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png">
          Google
        </button>

        <button id="outlookBtn" class="providerBtn microsoft">
          <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg">
          Microsoft
        </button>

        <button id="appleBtn" class="providerBtn apple">
          <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg">
          Apple
        </button>

      </div>

      <!-- ✅ CONNECTED ACCOUNTS -->
      <div id="accounts" class="accounts hidden"></div>
      
      <!-- ✅ COLOR LEGEND -->
      <div id="calendarLegend" class="calendarLegend"></div>

      <!-- ✅ ACTION BUTTONS -->
      <div class="actionButtons">

        <!-- ✅ UPDATED BUTTON (clearer + tooltip) -->
        
        <button id="createBtn"
          title="Example: 'Doctor Appointment at 3pm' or 'Team Meeting 10:00–11:00'">
          ➕ Create Event
        </button>

        <!-- 
        <button id="addTaskBtn">Add</button> 
        <button id="saveEventBtn">Save</button>
        <button id="cancelEventBtn">Cancel</button>
        -->

        <!-- ✅ ACCOUNTS BUTTON (SUBTLE ENTRY POINT) -->
        <button id="accountsBtn" title="Manage connected accounts"
          style="
            margin-left:6px;
            font-size:14px;
            padding:4px 8px;
            opacity:0.7;
            cursor:pointer;
          ">
          ⚙
        </button>

        <!-- ✅ SYNC (SUBTLE ICON) -->
        <button id="syncBtn" title="Sync calendars">
          <svg width="14" height="14" viewBox="0 0 24 24">
            <path fill="currentColor"
              d="M17.65 6.35A7.95 7.95 0 0012 4V1L7 6l5 5V7a5 5 0 11-5 5H5a7 7 0 107.75-6.97z"/>
          </svg>
        </button>

        <!-- ✅ LOGOUT (SUBTLE ICON) -->
        <button id="logoutBtn" title="Logout">
          <svg width="14" height="14" viewBox="0 0 24 24">
            <path fill="currentColor"
              d="M16 17l5-5-5-5v3H9v4h7v3zM4 19h8v2H4a2 2 0 01-2-2V5a2 2 0 012-2h8v2H4v14z"/>
          </svg>
        </button>

      </div>

    </div>

  </div>
</header>

<!-- =====================================================
✅ MAIN LAYOUT
===================================================== -->
<main class="layout">

  <!-- ✅ CALENDAR -->
  <div class="calendarPanel">

  <!-- ✅ RANGE + NAV BAR -->
  <div class="rangeBar">
    <!-- ✅ ✅ THESE ARE THE BUTTONS -->
    <div class="range-controls">
      <button class="range-btn active" id="monthly" data-range="30">(Monthly)</button>
      <button class="range-btn" id="quarterly" data-range="90">(Quarterly)</button>
      <button class="range-btn" id="semiAnnual" data-range="180">(Semi-Annual)</button>
      <button class="range-btn" id="yearly" data-range="360">(Yearly)</button>
      <button class="range-btn" id="customRange">(Custom)</button>
    </div>

    <!-- ***********************************************************
    ✅ RANGE DISPLAY (READ-ONLY UI STATE)
    • Shows active data window
    • MUST stay synced with JS logic
    ************************************************************ -->
    <div id="rangeDisplay" style="
      font-size:12px;
      color:#555;
      margin-top:4px;
    "></div>
  </div>

  <div id="calendar"></div>
</div>

  <!-- ✅ RIGHT SIDEBAR -->
  <div class="leftSidebar">

    <!-- ✅ DAY DETAILS -->
    <div class="card">
      <h4 id="selectedDateTitle">Select a day</h4>
      <ul id="dayEventsList"></ul>
    </div>

    <!-- ✅ WEEK VIEW -->
    <div class="card">
      <h4>This Week</h4>
      <div id="weekView"></div>
    </div>

    <!-- ✅ TASK LIST -->
    <div class="card">
      <h4>Tasks</h4>

      <div style="display:flex; gap:5px; margin-bottom:8px;">
        <input id="taskInput" placeholder="Add task..." style="flex:1;" />
        <button onclick="addTask()">Add</button>
      </div>

      <ul id="taskList"></ul>
    </div>

  </div>

</main>


<!-- =====================================================
✅ ✅ ✅ CREATE / EDIT EVENT MODAL (THIS WAS MISSING)
===================================================== -->
<div id="modalOverlay" class="modalOverlay"></div>

<div id="createEventModal" class="modal">

  <!-- ✅ TITLE -->
  <h3>Create Calendar Event</h3>

  <!-- ✅ HELPFUL INSTRUCTIONS -->
  <p style="font-size: 13px; color: #666; margin-bottom: 10px;">
    Example: "Team Meeting", "Doctor Appointment", or "Call with John at 2pm"
  </p>

  <!-- ✅ EVENT TITLE -->
  <input 
    id="eventTitle" 
    placeholder="e.g. Team Meeting or Dentist Appointment" 
    style="display:block; margin-bottom:8px; width:100%;" 
  />

  <!-- ✅ DATE -->
  <input 
    id="eventDate" 
    type="date" 
    style="display:block; margin-bottom:8px; width:100%;" 
  />

  <!-- ✅ TIME ROW -->
  <div style="display:flex; gap:5px; margin-bottom:10px;">
    <input 
      id="eventStart" 
      type="time" 
      title="Start time (optional)" 
      style="flex:1;" 
    />

    <input 
      id="eventEnd" 
      type="time" 
      title="End time (optional)" 
      style="flex:1;" 
    />
  </div>

  <!-- ✅ ACTION BUTTONS -->
  <div style="display:flex; justify-content:space-between; align-items:center;">

    <!-- ✅ DELETE BUTTON -->
    <button id="deleteEventBtn" style="display:none;">
      🗑 Delete
    </button>

    <!-- ✅ SAVE / CANCEL -->
    <div style="display:flex; gap:10px;">
      <button id="saveEventBtn">Save</button>
      <button id="cancelEventBtn">Cancel</button>
    </div>

  </div>

</div>

<!-- ✅ NEW (BRAIN FIRST) -->
<script src="/static/calendar.colors.js?v=1"></script>
<script src="/static/calendar.fullcalendar.js?v=124"></script>

<!-- ✅ EXISTING -->
<script src="/static/calendar.js?v=999"></script>
<script src="/static/calendar.ui.js"></script>


</body>
</html>

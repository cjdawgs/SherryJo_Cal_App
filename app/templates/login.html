<!DOCTYPE html>
<html>
<head>
  <script src="{{ asset_url('console_quiet.js') }}"></script>
  <title>Login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='none' d='M0 0h16v16H0z'/%3E%3C/svg%3E">

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin: 0;
      padding: 40px 14px;
      background: #f6f8fc;
    }

    .card {
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 10px 26px rgba(15, 23, 42, 0.08);
    }

    input {
      padding: 10px;
      margin: 10px;
      width: 100%;
      max-width: 420px;
      border: 1px solid #ccd7ea;
      border-radius: 8px;
    }

    select {
      padding: 10px;
      margin: 10px;
      width: 100%;
      max-width: 420px;
      border: 1px solid #ccd7ea;
      border-radius: 8px;
      background: #fff;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
      border: 1px solid #c8d2e5;
      border-radius: 8px;
      background: #fff;
    }

    .primary-btn {
      background: #2563eb;
      color: #fff;
      border-color: #1d4ed8;
    }

    .small-text {
      font-size: 14px;
      color: #555;
      margin-top: 8px;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .hint {
      font-size: 12px;
      color: #5f6b7a;
      margin-top: 6px;
    }

    #registerForm {
      margin-top: 16px;
      background: #f8fbff;
      border: 1px solid #d9e7ff;
      border-radius: 10px;
      padding: 12px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>Login or Create Account</h2>

    <form id="loginForm">
      <input id="email" name="email" type="text" placeholder="Username or email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required><br>
      <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required><br>

      <div class="button-row">
        <button id="loginBtn" class="primary-btn" type="submit">Login</button>
        <button type="button" onclick="showRegisterForm()">Create Account</button>
      </div>
      <div id="loginStatus" class="small-text" role="alert" aria-live="polite"></div>
      <div id="loginRecovery" class="hint" hidden></div>
    </form>

    <div id="registerForm" style="display:none;">
      <input id="registerUsername" type="text" placeholder="Username" autocomplete="nickname"><br>
      <input id="registerEmail" type="email" placeholder="Email" autocomplete="email"><br>
      <input id="registerPassword" type="password" placeholder="Password" autocomplete="new-password"><br>

      <select id="registerRole" onchange="toggleAdminCode()">
        <option value="staff">Staff</option>
        <option value="admin">Admin</option>
      </select>

      <div id="adminCodeWrap" style="display:none;">
        <input id="adminSetupCode" type="password" placeholder="Admin Setup Code" autocomplete="off"><br>
        <div class="hint">Admin mode requires setup code.</div>
      </div>

      <div class="button-row">
        <button class="primary-btn" onclick="registerUser()">Create User</button>
        <button onclick="hideRegisterForm()">Cancel</button>
      </div>
      <div id="registerStatus" class="small-text"></div>
    </div>
  </div>

  <script type="module">
    import { apiRequest, setAuthToken } from "{{ asset_url('api.js') }}";

    /**************************************************************
    * ✅ AUTO-REDIRECT IF ALREADY LOGGED IN
    **************************************************************/
    const existingToken = localStorage.getItem("token");

    if (existingToken) {
        console.log("✅ Already logged in, redirecting...");
        window.location.href = "/calendar-ui";
    }


    /**************************************************************
     * ✅ LOGIN FUNCTION (TOKENS + API)
     **************************************************************/
    async function login(event) {
      event?.preventDefault();
      const loginButton = document.getElementById("loginBtn");
      const loginStatus = document.getElementById("loginStatus");
      const loginRecovery = document.getElementById("loginRecovery");

      try {
        const form = document.getElementById("loginForm");
        const formData = new FormData(form);
        const identifier = String(formData.get("email") || "").trim().toLowerCase();
        const password = String(formData.get("password") || "");
        loginRecovery.hidden = true;
        loginRecovery.textContent = "";

        if (!identifier || !password) {
          loginStatus.textContent = "Please enter your username or email and password.";
          document.getElementById(identifier ? "password" : "email").focus();
          return;
        }

        loginButton.disabled = true;
        loginStatus.textContent = "Signing in...";

        const response = await apiRequest('/auth/login', {
          method: 'POST',
          auth: false,
          body: { email: identifier, password }
        });

        if (!response) {
          loginStatus.textContent = "Unable to reach the server. Please try again.";
          loginRecovery.textContent = "Check your connection, then press Login again. Your entries are still here.";
          loginRecovery.hidden = false;
          return;
        }

        const data = await response.json();

        if (!response.ok) {
          if (response.status === 401) {
            loginStatus.textContent = "That username or email and password did not match.";
            loginRecovery.textContent = "Try your registered username or your full email address. Passwords are case-sensitive. If an administrator reset your password, use the newest password.";
            loginRecovery.hidden = false;
            document.getElementById("password").focus();
            document.getElementById("password").select();
          } else if (response.status === 422) {
            loginStatus.textContent = "The login information was not in the expected format.";
            loginRecovery.textContent = "Enter either your username or your complete email address, then enter your password and try again.";
            loginRecovery.hidden = false;
            document.getElementById("email").focus();
          } else if (response.status === 503) {
            loginStatus.textContent = data.detail || "Login is temporarily unavailable.";
            loginRecovery.textContent = "Ask an administrator to verify Cloudflare JWT signing settings, then try again.";
            loginRecovery.hidden = false;
          } else {
            loginStatus.textContent = "Login could not be completed.";
            loginRecovery.textContent = "Your entries are still here. Press Login to retry; if it continues, ask an administrator to verify the account is active.";
            loginRecovery.hidden = false;
          }
          return;
        }

        const token = data.token || data.access_token;

        if (!token) {
          loginStatus.textContent = "Login could not be completed. Please try again.";
          loginRecovery.textContent = "The server accepted the login but could not start a session. Press Login again; your entries are still here.";
          loginRecovery.hidden = false;
          return;
        }

        setAuthToken(token);

        // ✅ Decide onboarding redirect based on existing accounts
        const accountRes = await apiRequest('/accounts', {
          method: 'GET'
        });
        if (accountRes && accountRes.ok) {
          const accounts = await accountRes.json();
          if (Array.isArray(accounts) && accounts.length === 0) {
            window.location.href = "/accounts/ui?onboarding=1";
            return;
          }
        }

        window.location.href = "/calendar-ui";

      } catch (error) {
        console.error("❌ Login error:", error);
        loginStatus.textContent = "Login failed. Please try again.";
        loginRecovery.textContent = "Your entries are still here. Press Login again after checking your connection.";
        loginRecovery.hidden = false;
      } finally {
        loginButton.disabled = false;
      }
    }

    document.getElementById("loginForm").addEventListener("submit", login);

    function showRegisterForm() {
      document.getElementById('registerForm').style.display = 'block';
      document.getElementById('registerStatus').textContent = '';
    }

    function hideRegisterForm() {
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('registerStatus').textContent = '';
    }

    function toggleAdminCode() {
      const role = document.getElementById('registerRole').value;
      const wrap = document.getElementById('adminCodeWrap');
      if (!wrap) return;
      wrap.style.display = role === 'admin' ? 'block' : 'none';
    }

    async function registerUser() {
      try {
        const email = document.getElementById('registerEmail').value.trim();
        const username = document.getElementById('registerUsername').value;
        const password = document.getElementById('registerPassword').value;
        const role = document.getElementById('registerRole').value;
        const adminSetupCode = document.getElementById('adminSetupCode').value;

        if (!email || !username || !password) {
          alert('Please enter email, username, and password.');
          return;
        }

        const response = await apiRequest('/auth/register', {
          method: 'POST',
          auth: false,
          body: JSON.stringify({
            email,
            username,
            password,
            role,
            admin_setup_code: adminSetupCode || null
          })
        });

        if (!response) {
          document.getElementById('registerStatus').textContent = 'Registration failed. Check console.';
          return;
        }

        const data = await response.json();

        if (!response.ok) {
          const detail = data.detail || data.message || 'Registration failed';
          document.getElementById('registerStatus').textContent = detail;
          return;
        }

        document.getElementById('registerStatus').textContent = 'Account created. Logging in...';

        const loginResponse = await apiRequest('/auth/login', {
          method: 'POST',
          auth: false,
          body: JSON.stringify({
            email,
            password
          })
        });

        if (!loginResponse) {
          document.getElementById('registerStatus').textContent = 'Registration succeeded, but login failed. Please try logging in.';
          return;
        }

        const loginData = await loginResponse.json();
        const token = loginData.token || loginData.access_token;

        if (!token) {
          document.getElementById('registerStatus').textContent = 'Registration succeeded, but login failed. Please try logging in.';
          return;
        }

        setAuthToken(token);

        const accountRes = await apiRequest('/accounts', { method: 'GET' });
        if (accountRes && accountRes.ok) {
          const accounts = await accountRes.json();
          window.location.href = Array.isArray(accounts) && accounts.length === 0 ? '/accounts/ui?onboarding=1' : '/calendar-ui';
          return;
        }

        window.location.href = '/accounts/ui?onboarding=1';

      } catch (error) {
        console.error('❌ Register error:', error);
        document.getElementById('registerStatus').textContent = 'Registration failed. Check console.';
      }
    }

    window.login = login;
    window.showRegisterForm = showRegisterForm;
    window.hideRegisterForm = hideRegisterForm;
    window.toggleAdminCode = toggleAdminCode;
    window.registerUser = registerUser;
  </script>
  <script type="module" src="{{ asset_url('dev_role_badge.js') }}"></script>
  <script src="{{ asset_url('window_controls.js') }}"></script>
  <script src="{{ url_for('static', path='button_hints.js') }}"></script>

</body>
</html>
